*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

h1{font:var(--fw-display) var(--text-title)/1.04 var(--font-display);letter-spacing:var(--tracking-display);color:var(--ink);text-wrap:balance}
p{margin-top:var(--space-3);max-width:34ch;font-size:var(--text-lede);line-height:1.5;color:var(--muted);text-wrap:pretty}
.home{margin-top:clamp(32px,4.5vh,44px);display:inline-flex;align-items:center;gap:.6em;height:52px;padding:0 26px;border-radius:var(--radius-pill);

  transition:transform var(--dur-hover) var(--ease-pop),background-color .2s ease,box-shadow var(--dur-hover) ease}
.home svg{width:1.05em;height:1.05em;transition:transform var(--dur-hover) var(--ease-pop)}
@media (hover:hover){.home:hover{transform:scale(1.05);background:#000;box-shadow:0 14px 30px -12px rgba(0,0,0,.55)}.home:hover svg{transform:translateX(3px)}}
.home:active{transform:scale(.98)}
.home:focus-visible{outline:2px solid var(--khyzr-green);outline-offset:4px}
h1,p,.home{animation:rise var(--dur-enter) var(--ease-trace) both}
h1{animation-delay:.42s}p{animation-delay:.54s}.home{animation-delay:.66s}
@keyframes bloom{from{opacity:0;transform:scale(.3) rotate(-30deg)}40%{opacity:1}to{opacity:1;transform:none}}
@keyframes light{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(var(--rise-distance)) scale(var(--rise-scale))}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
